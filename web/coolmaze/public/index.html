<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="keywords" content="cmaz.io share desktop cmaz android iphone browser hotmaze">
    <link rel="shortcut icon" href="%PUBLIC_URL%/favicon_576.png" sizes="any">
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/favicon_576_plain.png"/>
    <link rel="icon" href="%PUBLIC_URL%/favicon.svg" type="image/svg+xml">
    <!--
      Notice the use of %PUBLIC_URL% in the tag above.
      It will be replaced with the URL of the `public` folder during the build.
      Only files inside the `public` folder can be referenced from the HTML.

      Unlike "/favicon.ico" or "favicon.ico", "%PUBLIC_URL%/favicon.ico" will
      work correctly both with client-side routing and a non-root public URL.
      Learn how to configure a non-root public URL by running `npm run build`.
    -->
    <link rel="canonical" href="https://pushto.computer/" />
    <title>%REACT_APP_app_name% — Send files from your mobile to your computer</title>
    <!--
      Best-effort attempt to resolve DNS to GCS early, possibly even a TCP connection
      if scan happens in less than 10s.
    -->
    <link rel="preconnect" href="https://storage.googleapis.com" crossorigin>
  </head>
  <body>
    <script type="text/javascript">
      // Redirect legacy domain to new home
      if (location.hostname === "coolmaze.io" || location.hostname === "www.coolmaze.io") {
        location.replace("https://pushto.computer" + location.pathname + location.search);
      }
      // Cool Maze is unfortunately not compatible with IE
      if(/MSIE \d|Trident.*rv:/.test(navigator.userAgent)) {
          document.write('<h1>%REACT_APP_app_name%</h1>');
          document.write('<div style="color: green;">Your browser seems to be Internet Explorer. '
            + 'To share pictures with %REACT_APP_app_name%, please use either Edge, or Chrome, or Firefox.</div>');
      }
    </script>
